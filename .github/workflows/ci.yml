name: RAG Chatbot CI

on:
  push:
    branches: [ "Feature002" ]
  pull_request:
    branches: [ "Feature002" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run basic check
        run: |
          python --version
          pip list
